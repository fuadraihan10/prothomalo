<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=National+Park:wght@300;500;600;700;800&display=swap"
        rel="stylesheet">

    <title>Prothom Alo Navbar</title>

    <style>
        body {
            font-family: "National Park", sans-serif;
        }
    </style>
</head>

<body class="m-0">

    <header class="sticky top-0 z-50">
        <nav class="flex items-center justify-between bg-[#dc140a] px-4 py-3 text-white shadow-md sm:px-6 md:px-10">


            <a href="/"
                class="shrink-0 text-2xl font-extrabold tracking-tight transition-opacity duration-200 hover:opacity-80 md:text-3xl">
                Prothom Alo
            </a>


            <ul class="flex items-center gap-4 text-sm font-medium sm:gap-6 md:gap-8 md:text-base">
                <li>
                    <a href="/" class="relative py-2 transition-colors duration-200 hover:text-white/75">
                        Home
                    </a>
                </li>

                <li>
                    <a href="/news" class="relative py-2 transition-colors duration-200 hover:text-white/75">
                        News
                    </a>
                </li>

                <li>
                    <a href="/contact" class="relative py-2 transition-colors duration-200 hover:text-white/75">
                        Contact
                    </a>
                </li>
            </ul>

        </nav>
    </header>

</body>

</html>
